<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" preserveAspectRatio="xMidYMid meet" role="img" aria-label="YamlSigil v1alpha1 API flow diagram">
  <title>YamlSigil.v1alpha1 API Flow</title>
  <desc>High-level diagram: Document Authoring flows through the Signing API to a format-independent artifact (YAML and Protobuf with round-trip), then through the Verification API to the Original Document. Side branches show capability discovery and error surfaces.</desc>

  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#76B900"/>
    </marker>
    <marker id="arrowGreenStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#76B900"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa0a6"/>
    </marker>
    <marker id="arrowErr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c25450"/>
    </marker>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85cf00"/>
      <stop offset="1" stop-color="#69a300"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="860" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="600" y="42" fill="#76B900" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="0.5">YamlSigil.v1alpha1 API Flow</text>
  <text x="600" y="64" fill="#888888" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">authoring → signing → format-independent artifact → verification → verified document</text>

  <!-- ============ CENTRAL VERTICAL PATH (NVIDIA green nodes) ============ -->

  <!-- Document Authoring -->
  <rect x="450" y="92" width="300" height="58" rx="8" ry="8" fill="url(#greenFill)" stroke="#95e000" stroke-width="2"/>
  <text x="600" y="121" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Document Authoring</text>

  <!-- Arrow: Authoring → Sign -->
  <line x1="600" y1="150" x2="600" y2="200" stroke="#76B900" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Sign (Signing API) -->
  <rect x="450" y="205" width="300" height="70" rx="8" ry="8" fill="url(#greenFill)" stroke="#95e000" stroke-width="2"/>
  <text x="600" y="232" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">Sign</text>
  <text x="600" y="256" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">SIGNING API</text>

  <!-- Arrow: Sign → Artifact (via Transcription.Compose) -->
  <line x1="600" y1="275" x2="600" y2="320" stroke="#76B900" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="615" y="295" fill="#9ec96f" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" text-anchor="start">Compose</text>
  <text x="615" y="308" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">(Transcription API)</text>

  <!-- Format-Independent Container -->
  <rect x="335" y="325" width="530" height="140" rx="10" ry="10" fill="#76B900" fill-opacity="0.05" stroke="#76B900" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="600" y="347" fill="#76B900" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">FORMAT-INDEPENDENT · TRANSCRIPTION API</text>

  <!-- YAML node -->
  <rect x="380" y="365" width="170" height="60" rx="6" ry="6" fill="#0a0a0a" stroke="#76B900" stroke-width="2"/>
  <text x="465" y="395" fill="#76B900" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">YAML</text>

  <!-- Protobuf node -->
  <rect x="650" y="365" width="170" height="60" rx="6" ry="6" fill="#0a0a0a" stroke="#76B900" stroke-width="2"/>
  <text x="735" y="395" fill="#76B900" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">Protobuf</text>

  <!-- Bi-directional arrow between YAML and Protobuf -->
  <line x1="557" y1="395" x2="643" y2="395" stroke="#76B900" stroke-width="2.5" marker-start="url(#arrowGreenStart)" marker-end="url(#arrowGreen)"/>
  <text x="600" y="447" fill="#9ec96f" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle">transcoding</text>

  <!-- Arrow: Artifact → Verify (via Transcription.Decompose) -->
  <line x1="600" y1="465" x2="600" y2="515" stroke="#76B900" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="615" y="485" fill="#9ec96f" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" text-anchor="start">Decompose</text>
  <text x="615" y="498" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">(Transcription API)</text>

  <!-- Verify (Verification API) -->
  <rect x="450" y="520" width="300" height="70" rx="8" ry="8" fill="url(#greenFill)" stroke="#95e000" stroke-width="2"/>
  <text x="600" y="547" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">Verify</text>
  <text x="600" y="571" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">VERIFICATION API</text>

  <!-- Arrow: Verify → Verified -->
  <line x1="600" y1="590" x2="600" y2="640" stroke="#76B900" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Verified -->
  <rect x="490" y="645" width="220" height="50" rx="6" ry="6" fill="url(#greenFill)" stroke="#95e000" stroke-width="2"/>
  <text x="600" y="673" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Verified</text>

  <!-- Arrow: Verified → Original Document -->
  <line x1="600" y1="695" x2="600" y2="745" stroke="#76B900" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Original Document -->
  <rect x="440" y="750" width="320" height="60" rx="8" ry="8" fill="url(#greenFill)" stroke="#95e000" stroke-width="2"/>
  <text x="600" y="781" fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Original Document</text>

  <!-- ============ LEFT SIDE: CAPABILITIES ============ -->

  <!-- SignerCapabilities -->
  <rect x="80" y="210" width="270" height="60" rx="6" ry="6" fill="#141414" stroke="#4a7300" stroke-width="1.5"/>
  <text x="215" y="233" fill="#95c842" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">SignerCapabilities</text>
  <text x="215" y="253" fill="#9aa0a6" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">algorithms · output forms · YAML validation</text>

  <!-- Connection: SignerCapabilities → Sign -->
  <line x1="350" y1="240" x2="445" y2="240" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDim)"/>

  <!-- VerifierCapabilities -->
  <rect x="80" y="520" width="270" height="60" rx="6" ry="6" fill="#141414" stroke="#4a7300" stroke-width="1.5"/>
  <text x="215" y="543" fill="#95c842" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">VerifierCapabilities</text>
  <text x="215" y="563" fill="#9aa0a6" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">profile · forms · algorithms · helpers</text>

  <!-- Connection: VerifierCapabilities → Verify -->
  <line x1="350" y1="550" x2="445" y2="550" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDim)"/>

  <!-- Pre-Verify Helpers -->
  <rect x="80" y="600" width="270" height="78" rx="6" ry="6" fill="#141414" stroke="#4a7300" stroke-width="1.5"/>
  <text x="215" y="622" fill="#95c842" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">Pre-Verification Helpers</text>
  <text x="215" y="642" fill="#9aa0a6" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">CanPreVerify · PreVerify</text>
  <text x="215" y="658" fill="#9aa0a6" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">VerifyFromPreVerify</text>
  <text x="215" y="673" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" dominant-baseline="middle">processing optimizations</text>

  <!-- Connection: helpers → Verify -->
  <path d="M 350 615 Q 415 605 445 580" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDim)"/>

  <!-- ============ RIGHT SIDE: ERRORS ============ -->

  <!-- Signer Errors -->
  <rect x="850" y="200" width="270" height="80" rx="6" ry="6" fill="#141414" stroke="#c25450" stroke-width="1.5"/>
  <text x="985" y="222" fill="#e8a8a5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">Signer Errors</text>
  <text x="985" y="247" fill="#bbbbbb" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">request-shape errors</text>
  <text x="985" y="265" fill="#bbbbbb" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">sign-time errors</text>

  <!-- Connection: Sign → Signer Errors -->
  <line x1="755" y1="240" x2="845" y2="240" stroke="#c25450" stroke-width="1.5" marker-end="url(#arrowErr)"/>

  <!-- Verification Errors -->
  <rect x="850" y="515" width="270" height="100" rx="6" ry="6" fill="#141414" stroke="#c25450" stroke-width="1.5"/>
  <text x="985" y="537" fill="#e8a8a5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">Verification Errors</text>
  <text x="985" y="562" fill="#bbbbbb" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">invocation errors</text>
  <text x="985" y="580" fill="#bbbbbb" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">non-Verified states</text>
  <text x="985" y="601" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" dominant-baseline="middle">Unsigned · Malformed · Unsupported · Failed</text>

  <!-- Connection: Verify → Verification Errors -->
  <line x1="755" y1="555" x2="845" y2="555" stroke="#c25450" stroke-width="1.5" marker-end="url(#arrowErr)"/>

  <!-- ============ FOOTER ============ -->
  <text x="600" y="838" fill="#555555" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">authoritative API shape: signing.proto · transcription.proto · verification.proto — this is a higher-level view</text>
</svg>
