version: v2
managed:
  enabled: true
  override:
    # REQUIRED: Replace this sentinel with the downstream Go module path.
    - file_option: go_package_prefix
      value: example.invalid/replace-with-your-module
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    revision: 1
    out: go
    opt:
      - paths=source_relative
    exclude_types:
      - yaml_sigil.v1alpha1.SigningService
      - yaml_sigil.v1alpha1.TranscriptionService
      - yaml_sigil.v1alpha1.VerificationService
inputs:
  # Generates straight from the published specification, so no local clone is
  # required. Replace `branch` with `tag: <release>` or `ref: <commit>` to pin.
  - git_repo: https://github.com/NVIDIA/yaml-sigil-spec.git
    branch: main
    subdir: proto
