name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    name: GitHub Actions
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12 (actionlint v1.7.12)

      # This section would benefit by a change to the action allowlist
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: true
          scandir: .github/scripts
          version: v0.11.0

      - name: Compile and test protected controller
        run: |
          python3 -m py_compile \
            .github/scripts/protected_pr_ci.py \
            .github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s .github/scripts -p 'test_protected_pr_ci.py'

  platform_verifier:
    name: Protected policy verifier tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercise the checkout verifier on each supported host, including a
      # real Windows directory junction rather than a mocked reparse point.
      - name: Compile and test protected checkout verifier
        shell: bash
        run: |
          python3 -m py_compile \
            .github/scripts/protected_checkout.py \
            .github/scripts/protected_pr_ci.py \
            .github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s .github/scripts -p 'test_protected_pr_ci.py'

  markdown:
    name: Markdown
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          version: "0.2.54"

  contracts:
    name: Schema and Protobuf
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Protobuf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          archive: false
          breaking: false
          format: true
          input: proto
          lint: true
          pr_comment: false
          push: false

      - name: Validate JSON Schema
        run: jq empty schema/YamlSigilSignature.v1alpha1.schema.json

  rebuild_rs:
    name: Rust conformance generator
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt
          toolchain: stable

      # This section would benefit by a change to the action allowlist
      - name: Install Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-machete@0.9.2

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: conformance/rebuild-rs -> target

      - name: Check Rust formatting
        run: cargo fmt --all --check
        working-directory: conformance/rebuild-rs

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: conformance/rebuild-rs

      - name: Test Rust
        run: cargo test --locked --workspace --all-features
        working-directory: conformance/rebuild-rs

      - name: Check unused Rust dependencies
        run: cargo-machete --with-metadata

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: conformance/rebuild-rs

  required_ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - workflow_lint
      - platform_verifier
      - markdown
      - contracts
      - rebuild_rs
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful CI jobs
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          GITHUB_ACTIONS_RESULT: ${{ needs.workflow_lint.result }}
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
          PLATFORM_VERIFIER_RESULT: ${{ needs.platform_verifier.result }}
          REBUILD_RS_RESULT: ${{ needs.rebuild_rs.result }}
        run: |
          require_success() {
            local job="$1"
            local result="$2"
            if [[ "${result}" != "success" ]]; then
              printf '%s finished with result %s; success is required.\n' \
                "${job}" "${result}"
              exit 1
            fi
          }

          require_success "GitHub Actions" "${GITHUB_ACTIONS_RESULT}"
          require_success "Protected checkout verifier matrix" "${PLATFORM_VERIFIER_RESULT}"
          require_success "Markdown" "${MARKDOWN_RESULT}"
          require_success "Schema and Protobuf" "${CONTRACTS_RESULT}"
          require_success "Rust conformance generator" "${REBUILD_RS_RESULT}"
