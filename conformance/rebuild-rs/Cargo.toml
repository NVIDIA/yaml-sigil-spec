[package]
name = "yamlsigil-conformance-rebuild"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Generators for conformance/ fixtures."

[[bin]]
name = "rebuild_all"
path = "src/main.rs"

[dependencies]
# Pinned exact versions; Cargo.lock locks the transitive graph.
sha2 = "=0.10.8"
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
# The xtask crate provides developer-only commands (e.g. refreshing
# vendored ACVP test vectors). It is NOT in `default-members` so a
# bare `cargo build` builds only the main rebuilder; `cargo xtask ...`
# invokes the xtask via the alias in `.cargo/config.toml`.
members = ["xtask"]
default-members = ["."]
