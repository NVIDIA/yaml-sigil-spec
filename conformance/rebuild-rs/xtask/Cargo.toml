[package]
name = "xtask"
version = "0.0.1"
edition = "2021"
publish = false
# Keep the executable target inventory explicit. Conventional target
# directories do not add code to validation without a manifest change.
autobenches = false
autobins = false
autoexamples = false
autotests = false
# This developer tool has no build script.
build = false
license = "Apache-2.0"
description = "Developer-only tasks (vendor refresh, etc.) for rebuild-rs."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ureq = { version = "=3.4.0", default-features = false, features = ["platform-verifier", "rustls"] }
yamlsigil-pinned-dir = { path = "../pinned-dir" }
