[package]
name = "yamlsigil-pinned-dir"
version = "0.0.1"
edition = "2021"
publish = false
# Keep the executable target inventory explicit. Conventional target
# directories do not add code to validation without a manifest change.
autobenches = false
autobins = false
autoexamples = false
autotests = false
# This repository-local library has no build script.
build = false
license = "Apache-2.0"
description = "Repository-local pinned-directory writes for conformance tooling."

[lib]
path = "src/lib.rs"
